[project]
name = "vaultmind-mcp"
version = "0.1.0"
description = "Give Claude access to your private local files without giving Anthropic your private files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jason Shotwell" }]
keywords = ["mcp", "rag", "local-first", "privacy", "claude"]

dependencies = [
    "mcp>=1.2,<2.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/shotwellj/VaultMind"
Source = "https://github.com/shotwellj/VaultMind"

[project.scripts]
vaultmind-mcp = "vaultmind_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaultmind_mcp"]
